project:
  type: website
  output-dir: docs

website:
  title: "FEWS Lab"
  favicon: "images/FEWS-logo.png"
  navbar:
    logo: "images/FEWS-logo.png"
    right:
      - href: index.qmd
        text: Home
      - kevin-bladon.qmd
      - research/index.qmd
  page-footer:
      background: light # or `dark` or omit this option altogether (footer color will match page body color)
      left: | 
        <span class="footer-copyright">Copyright 2026, Kevin Bladon</span>      · 
        [{{< fa envelope size=2xl >}}](mailto:kevin.bladon@oregonstate.edu)  · 
        [{{< fa brands twitter size=2xl >}}](https://twitter.com/H2OScientist)  · 
        [{{< ai google-scholar size=2xl >}}](https://scholar.google.com/citations?user=w3daILIAAAAJ&hl=en&oi=ao)  · 
        [{{< fa graduation-cap size=2xl >}}](https://www.researchgate.net/profile/Kevin_Bladon)
        
      right: This website is built with [{{< fa brands github title="GitHub octocat logo" >}}](https://github.com/FEWS-lab/FEWS-lab.github.io){target=_blank}, [{{< fa brands r-project title="R Project" >}}](https://www.r-project.org/about.html){target=_blank} and [Quarto](https://quarto.org/){target=_blank}

format:
  html:
    theme:
      - styles.scss
    toc: true
    grid:
      body-width: 1100px

execute:
  freeze: auto
  
editor: source

