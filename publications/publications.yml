- key: wisslerComparingHeadwaterStream2022
  title: Comparing headwater stream thermal sensitivity across two distinct regions
    in Northern California
  authors:
  - firstName: Austin D.
    lastName: Wissler
    creatorType: author
  - firstName: Catalina
    lastName: Segura
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2022'
  journal: Hydrological Processes
  volume: '36'
  issue: '3'
  pages: e14517
  doi: 10.1002/hyp.14517
  abstract: Thermal regimes in headwater streams are critical for freshwater ecological
    condition and habitat resilience to disturbance, and to inform sustainable forest
    management. However, stream temperatures vary depending on characteristics of
    the stream, catchment, or region. To improve our knowledge of stream thermal regimes,
    we collected stream and air temperature data along eight headwater streams in
    two regions in Northern California. Five streams were in the Coast Range, which
    is characterized by permeable sandstone lithology, rain dominated precipitation
    regime, and dense coast redwood forests. Three streams were in the Cascade Range,
    which is characterized by fractured and resistant basalt lithology, snow dominated
    precipitation, and low to moderate density pine forests. We instrumented each
    stream with 12 stream temperature and four air temperature sensors during summer
    2018. We compared stream thermal regimes and thermal sensitivity—slope of the
    linear regression between daily stream and air temperature—within and between
    study regions. Mean daily stream temperatures were 4.7°C warmer in the Coast Range
    but were less variable (SD = 0.7°C) compared to the Cascade Range (SD = 2.3°C).
    Median thermal sensitivity was 0.33°C °C−1 in the Coast Range and 0.23°C °C−1
    in the Cascade Range. We posit that the volcanic lithology underlying the Cascade
    streams likely supported discrete groundwater discharge locations of cold snowmelt
    water, which dampened thermal sensitivity. At locations of apparent groundwater
    discharge in these streams, median stream temperatures rapidly decreased by 2.0–7.0°C
    relative to locations 70–90 m upstream. In contrast, thin friable soils in the
    Coast Range likely contributed warmer, rain dominated baseflow from shallow subsurface
    sources, which strongly co-varied with air temperature and generally warmed downstream
    (up to 2.1°C km−1). Our study revealed distinct longitudinal thermal regimes in
    streams with contrasting lithology, precipitation regimes, and stand densities
    suggesting that streams in these different regions may respond differentially
    to forest disturbances or climate change.
