- key: miralhaCharacterizingStreamTemperature2023
  title: Characterizing stream temperature hysteresis in forested headwater streams
  authors:
  - firstName: Lorrayne
    lastName: Miralha
    creatorType: author
  - firstName: Austin D.
    lastName: Wissler
    creatorType: author
  - firstName: Catalina
    lastName: Segura
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2023'
  journal: Hydrological Processes
  volume: '37'
  issue: '1'
  pages: e14795
  doi: 10.1002/hyp.14795
  abstract: Stream temperature (Ts) is a key water quality parameter that controls
    several biological, ecological, and chemical processes in aquatic systems. In
    forested headwaters, exchanges of energy across air-water-streambed interfaces
    may influence Ts regimes, especially during storm events as the sources of runoff
    change over space and time. Analysis of the hysteretic behaviour of Ts during
    storm events may provide insights into rainfall-runoff responses, but such relationships
    have not been thoroughly investigated. As such, our objectives were to (a) quantify
    the variability of stream temperature hysteresis across seasons in different sub-regions
    and (b) investigate the relationship between the hysteretic response and catchment
    characteristics. Ts hysteresis during storm events was assessed based on the hysteresis
    index (HI), which describes the directionality of hysteresis loops, and the temperature
    response index (TRI), which indicates whether Ts increased or decreased during
    a storm event. We analysed Ts data from 10 forested headwater reaches in two sub-regions
    (McGarvey and West Fork Tectah) in Northern California. We also performed a clustering
    analysis to examine the relationship amongst HI, TRI, topographic metrics, and
    meteorological characteristics of the study areas. Overall, the hysteretic behaviour
    of Ts varied across seasons—the greatest HI occurred during spring and summer.
    Interestingly, in the McGarvey streams the variability in Ts hysteresis co-varied
    strongly with topographic metrics (i.e., upslope accumulative area, average channel
    slope, topographic wetness index). Comparatively, in West Fork Tectah the variability
    of Ts hysteresis co-varied most strongly with meteorological metrics (i.e., antecedent
    rainfall events, solar radiation, and air temperature). Variables such as the
    gradient between stream and air temperatures, slope, and wetted width were significant
    for both sub-regional hysteretic patterns. We posit that the drivers of Ts response
    during storms are likely dependent on catchment physiographic characteristics.
    Our study also illustrated the potential utility of stream temperature as a tracer
    for improving the understanding of hydrologic connectivity and shifts in the dominant
    runoff contributions to streamflow during storm events.
  url: https://onlinelibrary.wiley.com/doi/abs/10.1002/hyp.14795
  has_article: yes
  primary: yes
  inreview: no
  informal: no
- key: jareckeCarbonUptakeDouglasfir2023
  title: Carbon uptake by Douglas-fir is more sensitive to increased temperature and
    vapor pressure deficit than reduced rainfall in the western Cascade Mountains,
    Oregon, USA
  authors:
  - firstName: Karla M.
    lastName: Jarecke
    creatorType: author
  - firstName: Linnia R.
    lastName: Hawkins
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Steven M.
    lastName: Wondzell
    creatorType: author
  date: '2023-02-15'
  journal: Agricultural and Forest Meteorology
  volume: '329'
  issue: ~
  pages: '109267'
  doi: 10.1016/j.agrformet.2022.109267
  abstract: Understanding how trees respond to drought is critical to understanding
    forest sensitivity to global climate change, which can help inform forest policy
    and management decisions. However, mechanisms governing carbon fixation and water
    fluxes in response to increased temperatures and water limitation in regions with
    Mediterranean climates, with wet winters and dry summers, remain only partially
    understood. We tested the effect of increased vapor pressure deficit (VPD) and
    decreased rainfall on water and carbon fluxes of Douglas-fir (Pseudotsuga menziesii)
    trees using the Soil-Plant-Atmosphere model (SPA). We simulated a 50-year-old
    Douglas-fir stand on the western slopes of the Cascade Mountains in Oregon, USA.
    Simulation results showed that increasing the daily maximum VPD by 0.25–2.5 kPa
    during the summer increased cumulative transpiration by 1–3% and decreased cumulative
    gross primary production by 3–25%. In contrast, decreasing rainfall by 10–100%
    during the spring and summer decreased cumulative transpiration by 2–16% and decreased
    cumulative gross primary production by 0.5–4%. Transpiration was highly sensitive
    to decreases in rainfall, especially in late spring and early summer but much
    less sensitive to increases in maximum daily VPD. In contrast, gross primary productivity
    was much more sensitive to VPD, with summertime increases in VPD having a 5- to
    6-fold greater effect on gross primary productivity than did decreasing the rainfall.
    These results suggested that temperature increases expected from climate change
    in combination with increases in VPD are likely to reduce forest productivity
    regardless of soil moisture availability.
  url: https://www.sciencedirect.com/science/article/pii/S0168192322004543
  has_article: yes
  primary: yes
  inreview: no
  informal: no
- key: grahamPotentialBioavailabilityRepresentative2023
  title: Potential bioavailability of representative pyrogenic organic matter compounds
    in comparison to natural dissolved organic matter pools
  authors:
