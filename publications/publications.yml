- key: mccredieStreamSoilNitrogen2025
  title: 'Stream and soil nitrogen response to overlapping forest disturbance: The
    impact of harvesting, wildfire, and post-fire management on a western Oregon,
    USA watershed'
  authors:
  - firstName: Katherine E.
    lastName: McCredie
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Thomas H.
    lastName: DeLuca
    creatorType: author
  date: '2025-09-15'
  journal: Forest Ecology and Management
  volume: '592'
  issue: ~
  pages: '122787'
  doi: 10.1016/j.foreco.2025.122787
  abstract: To understand the magnitude of effects from forest disturbance in watersheds—and
    their impacts on ecosystems and communities—it is essential to integrate field
    measurements within aquatic and terrestrial environments. We leveraged 13 years
    of empirical data across a stream network in the Hinkle Creek Experimental Watershed
    (1941 ha) located on an intensively managed Douglas-fir (Pseudotsuga menziesii)
    plantation in western Oregon, USA, which was ∼98 % burned by wildfire in 2020.
    We investigated the impact of overlapping disturbance (forest harvesting, wildfire,
    and post-fire land management) on stream water nitrate (NO3--N) and the potential
    linkage between post-fire riparian mineral soils and in-stream water quality.
    There was no impact of time since fire on soil NO3--N, a decrease in ammonium
    (NH4+-N), an increase in potentially mineralizable N, and no clear contribution
    of these post-fire soil concentrations to streams. We observed no change in stream
    water NO3--N concentrations after forest harvesting and average concentrations
    ranged from 0.05 to 0.26 mg L-1. After wildfire and post-fire management, average
    concentrations ranged from 0.22 to 1.12 mg L-1. Contrary to other studies, there
    was a negative relationship (r2 = 0.84, p < 0.001) between concentrations and
    high soil burn severity. While we observed higher concentrations in the catchment
    that experienced more salvage logging, better spatial and temporal information
    on forest operations from land managers is needed to help disentangle disturbance
    periods. Additionally, simultaneous in-situ measurements of streams and soils
    could help illuminate biogeochemical connections to identify the source, magnitude,
    and legacy of disturbance impacts.
