- key: silinsImpactsWildfirePostfire2008
  title: Impacts of wildfire and post-fire salvage logging on sediment transfer in
    the Oldman watershed, Alberta, Canada
  authors:
  - firstName: U.
    lastName: Silins
    creatorType: author
  - firstName: M.
