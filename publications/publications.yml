  - firstName: Drew B. R.
    lastName: Coe
    creatorType: author
  date: '2020'
  journal: Hydrological Processes
  volume: '34'
  issue: '26'
  pages: 5242-5259
  doi: 10.1002/hyp.13932
  abstract: High severity wildfires impact hillslope processes, including infiltration,
    runoff, erosion, and sediment delivery to streams. Wildfire effects on these processes
    can impair vegetation recovery, producing impacts on headwater and downstream
    water supplies. To promote forest regeneration and maintain forest and aquatic
    ecosystem functions, land managers often undertake active post-fire land management
    (e.g., salvage logging, sub-soiling, re-vegetation). The primary objective of
    our study was to quantify and compare sediment yields eroded from (a) burned,
    (b) burned and salvage logged, and (c) burned, salvage logged, and sub-soiled
    plots following the 2015 Valley Fire in the northern California Coast Range. We
    distributed 25 sediment fences ( 75 m2 contributing area) across four hillslopes
    burned at high severity and representative of the three management types. We collected
    eroded sediment from the fences after precipitation events for 5 years. We also
    quantified precipitation, canopy cover, ground cover, and soil properties to characterize
    the processes driving erosion across the three management types. Interestingly,
    during the second year after the fire, sediment yields were greater in the burned-only
    plots compared with both the salvage logged and sub-soiled plots. By the third
    year, there were no differences in sediment yields among the three management
    types. Sediment yields decreased over the 5 years of the study, which may have
    occurred due to site recovery or exhaustion of mobile sediment. As expected, sediment
    yields were positively related to precipitation depth, bulk density, and exposed
    bare soil, and negatively related to the presence of wood cover on the soil surface.
    Unexpectedly, we observed greater sediment yields on the burned-only plots with
    greater canopy closure, which we attributed to increased throughfall drop size
    and kinetic energy related to the residual canopy. While these results will aid
    post-fire management decisions in areas with Mediterranean climates prone to low
    intensity, long duration rainstorms, additional research is needed on the comparative
    effects of post-fire land management approaches to improve our understanding of
    the mechanisms driving post-fire erosion and sediment delivery.
