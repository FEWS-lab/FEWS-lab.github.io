  volume: '57'
  issue: '11'
  pages: e2020WR029170
  doi: 10.1029/2020WR029170
  abstract: Variations in hillslope soil moisture control forest hydrologic fluxes
    and storage pools, yet sparse observations combined with the complexity and heterogeneity
    of water movement and storage in the vadose zone can make temporal and spatial
    patterns and processes difficult to predict. We used two years of field observations
    of volumetric soil moisture at three depths (15, 30, and 100 cm) across five topographic
    positions (riparian, toeslope, sideslope, shoulder, and ridge) along three hillslope
    transects to better understand how soil moisture changes with hillslope position
    and through time. As expected, we found higher values of soil moisture at all
    depths at the riparian and toeslope positions. Unexpectedly, we found that ridges
    were particularly wet during the wet winter months and dried quickly during the
    summer months, indicating that topography alone cannot account for mean wet season
    soil moisture in our Mediterranean climate field site. The variability in soil
    moisture across all soil depths and topographic positions was greatest when soils
    were dry and decreased under wet soil conditions; this variability remained high
    in the deeper soil horizons, regardless of season. Lastly, event analysis suggests
    that the response to early season rainfall was highly variable along the hillslopes
    and was likely dominated by localized controls such as microtopography and vegetation
    as well as soil texture, antecedent moisture conditions, and rainfall characteristics.
    Our results suggest that the drivers of wet and dry season soil moisture dynamics
    can vary across topographic positions along a hillslope and do not always follow
    topographic controls.
