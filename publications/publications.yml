- key: miralhaStreamTemperatureResponses2024
  title: Stream temperature responses to forest harvesting with different riparian
    buffer prescriptions in northern California, USA
  authors:
  - firstName: Lorrayne
    lastName: Miralha
    creatorType: author
  - firstName: Catalina
    lastName: Segura
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2024-01-15'
  journal: Forest Ecology and Management
  volume: '552'
  issue: ~
  pages: '121581'
  doi: 10.1016/j.foreco.2023.121581
  abstract: Forested riparian zones adjacent to headwater streams provide unique habitat
    attributes and influence water quantity and quality. Forest harvesting adjacent
    to and within these zones has led to changes in stream temperature (Ts) and impacts
    on aquatic ecosystems. As such, policies and regulations have sought to limit
    forest management activities in riparian zones; however, water temperature responses
    have been variable, necessitating additional research to improve our understanding
    of the effectiveness of contemporary riparian harvesting prescriptions in limiting
    water temperature increases after harvest. We sought to quantify the effects of
    three different riparian buffer prescriptions with increasing intensity of basal
    area removal (2–43% area harvested) on Ts in forested headwaters in northern California,
    USA. We measured Ts in 18 headwater catchments (12 harvested, 6 six unharvested
    references) during a pre-harvest year and two post-harvest years using 12 thermistors
    distributed longitudinally down each stream (i.e., 216 total sensors). We analyzed
    the Ts data to assess (1) the seasonal variability of seven-day moving average
    of daily maximum stream temperature (T7-day-max) and (2) the relative importance
    of the different harvesting prescriptions and catchment physiographic characteristics
    in influencing the T7-day-max. Our analysis indicated substantial changes in basal
    area and shade in the riparian areas with the most intensive harvesting treatment
    (i.e., 50% reduction in canopy cover). However, these changes in riparian canopy
    were poorly related to stream temperature. Results indicated a median T7-day-max
    increase of ∼ 2 °C in the sites with the most intensive harvesting treatment.
    The greatest changes in seasonal T7-day-max occurred during the summer and fall
    but only during the first year after harvesting. There was no evidence of increases
    in T7-day-max during the second post-harvest year. While air temperatures in the
    riparian areas increased by 1–5 °C after harvesting, this warming did not directly
    transfer to strong warming in stream temperatures. Rather, random forest models
    revealed that T7-day-max was more strongly related to topography (i.e., elevation)
    and climatic variability (i.e., changes in precipitation and stream stage) than
    to the riparian harvesting prescription or the harvesting period. Our study further
    highlights the challenges in understanding the thermal regimes of headwater streams
    and their responses to forest disturbances. Predictions of stream temperature
    responses to forest disturbances are complicated by the heterogeneity of the factors
    that influence this important physical water quality parameter. However, with
    global climate change and increasing pressures on water resources and aquatic
    ecosystems it is increasingly important to continue to provide insights into the
    relationships between forest management activities and the thermal regimes of
    headwater streams.
  url: https://www.sciencedirect.com/science/article/pii/S0378112723008150
