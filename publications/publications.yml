- key: roonLinkingFireFood2025
  title: Linking Fire, Food Webs, and Fish in Stream Ecosystems
  authors:
  - firstName: David A.
    lastName: Roon
    creatorType: author
  - firstName: J. Ryan
    lastName: Bellmore
    creatorType: author
  - firstName: Joseph R.
