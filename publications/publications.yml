  doi: 10.1016/j.scitotenv.2024.178040
  abstract: Increasing wildfire severity is of growing concern in the western United
    States, with consequences for the production, composition, and mobilization of
    dissolved organic matter (DOM) from terrestrial to aquatic systems. Our current
    understanding of wildfire impacted DOM (often termed pyrogenic DOM) composition
    is largely built from temperature-based studies that can be difficult to extrapolate
    to field conditions, which are often defined by ‘burn severity’, or the post-wildfire
    impact observed at a site. Thus, burn severity can encapsulate a broader range
    of fire and environmental conditions not exclusive to temperature. Biogeochemical
    studies that describe DOM along burn severity continuums remain limited but are
    needed to better link DOM composition with field conditions post-fire. In this
    study, we addressed this need with an experimental open air burn simulation that
    generated chars from vegetation representative of major land cover types in the
    western United States. The chars were leached to simulate DOM mobilization potential.
    The DOM composition was characterized by ultra-high resolution mass spectrometry
    (HR-MS) and UV/VIS absorbance and fluorescence. Our results indicated that the
    shifts of DOM production and composition along a burn-severity gradient depends
    on the land cover type that was burned, with the degree of change dependent on
    the composition of the starting parent vegetation material. Fluorescence signatures
    indicated a strong convergence across land cover types to more aromatic DOM with
    increasing severity, while HR-MS indicated an increase in the production of aromatic
    nitrogen containing DOM with increasing severity. Results from this study enhance
    our ability to describe DOM composition in a framework that can be more directly
    related with field and remote-sensing based metrics.
