- key: jareckeInfluenceLocalNonlocal2021
  title: The Influence of Local and Nonlocal Factors on Soil Water Content in a Steep
    Forested Catchment
  authors:
  - firstName: Karla M.
    lastName: Jarecke
    creatorType: author
  - firstName: Kevin D.
