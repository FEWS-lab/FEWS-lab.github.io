- key: bothwellIronNotResponsible2012
  title: Iron is not responsible for Didymosphenia geminata bloom formation in phosphorus-poor
    rivers
  authors:
  - firstName: Max L.
    lastName: Bothwell
    creatorType: author
  - firstName: Cathy
    lastName: Kilroy
    creatorType: author
  - firstName: Brad W.
    lastName: Taylor
    creatorType: author
  - firstName: Eric T.
    lastName: Ellison
    creatorType: author
  - firstName: Daniel A.
    lastName: James
    creatorType: author
  - firstName: Carole-Anne
    lastName: Gillis
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Uldis
    lastName: Silins
    creatorType: author
  date: 11/2012
  journal: Canadian Journal of Fisheries and Aquatic Sciences
  volume: '69'
  issue: '11'
  pages: 1723-1727
  doi: 10.1139/f2012-112
  abstract: Blooms of the river benthic diatom Didymosphenia geminata are an enigma
    because they occur under phosphorus-poor conditions. A recent proposal that ferric–ferrous
    iron redox shifts sequester the additional phosphorus needed to stimulate and
    sustain D. geminata blooms does not agree with published experimental data showing
    that blooms only occur when cells are phosphorus-limited. The “iron hypothesis”
    also infers that blooms would be favoured in rivers with elevated iron, and management
    should target iron. Surveys of rivers around the world affected by D. geminata
    show that blooms most often occur in iron-poor rivers. Phosphorus uptake experiments
    conducted under realistic environmental conditions with living D. geminata colonies
    showed no effect of iron enrichment on phosphorus uptake. Iron does not solve
    the mystery of D. geminata growth causing nuisance blooms worldwide.
  url: http://www.nrcresearchpress.com/doi/10.1139/f2012-112
  has_article: yes
  primary: no
  inreview: no
  informal: no
- key: bladonDifferentialTranspirationThree2006
  title: Differential transpiration by three boreal tree species in response to increased
    evaporative demand after variable retention harvesting
  authors:
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Uldis
    lastName: Silins
    creatorType: author
  - firstName: Simon M.
    lastName: Landhäusser
    creatorType: author
  - firstName: Victor J.
    lastName: Lieffers
    creatorType: author
  date: '2006-08-29'
  journal: Agricultural and Forest Meteorology
  volume: '138'
  issue: '1'
  pages: 104-119
  doi: 10.1016/j.agrformet.2006.03.015
  abstract: 'We compared the change in microclimate and tree water relations between
    a boreal mixedwood, variable retention (VR), partially harvested stand and an
    adjacent, unharvested control stand. A nearly three-fold increase in potential
    evapotranspiration (ETP) at the crown level in the VR site was approximately proportional
    to a 2.8-fold increase in wind speed (u), along with subsidiary increases in net
    radiation (Q*) and vapour pressure deficit (D) after harvesting. Soil volumetric
    moisture content (θv) also increased, while there were negligible changes in air
    temperature (Ta) and relative humidity (RH) after partial harvesting. Whole-tree
    sap flow response to cutting was measured in white spruce (Picea glauca), balsam
    poplar (Populus balsamifera) and paper birch (Betula papyrifera) with thermal-dissipation
    sap flow sensors. After partial harvesting, transpiration per unit leaf area (Ql)
    in all three species began earlier in the morning and extended later in the day
    in VR trees than control trees. Mean maximum sap flow rates per leaf area (Ql-max)
    during mid-day for P. glauca in the VR site were about 2.5 times greater than
    in the control trees, while B. papyrifera Ql-max was approximately 1.6 times higher
    in the VR site. For P. balsamifera, however, Ql-max was only marginally greater
    in the VR site than in the control. This suggests stomatal closure by the P. balsamifera
    and B. papyrifera residual trees likely occurred to prevent excessive xylem cavitation.
    Xylem pressure potential (Ψx) measurements of twigs also indicated water stress
    in both P. balsamifera and B. papyrifera in the VR stand, but not for P. glauca.
    However, similarity of sapwood hydraulic conductivity (KΨ) between the two sites,
    for all three species, showed that xylem cavitation of the main stems was insignificant
    following VR harvesting. Decoupling coefficients (Ω) indicated that all three
    species were more coupled to the atmosphere in the VR site than in the control.
    Species differences in susceptibility to atmospheric moisture-stress induced cavitation,
    combined with differences in stress-coping mechanisms and physiology, appeared
    to influence the response in transpiration to increased ETP following VR harvesting.
    Species susceptibility to atmospheric moisture-stress due to increased ETP following
    partial harvesting can be ranked as: P. balsamifera>B. papyrifera>P. glauca.'
