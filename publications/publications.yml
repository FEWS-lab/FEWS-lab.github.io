  issue: '5'
  pages: e2020WR028343
  doi: 10.1029/2020WR028343
  abstract: Surface topography can influence flow pathways and the location of runoff
    source areas and water transport in steep headwater catchments. However, the influence
    of topography on spatial patterns of residual soil moisture is less well understood.
    We measured soil volumetric water content (VWC) on 14 dates at 0–30 and 30–60
    cm depth at 54 sites on a steep, 10 ha north-facing forested slope in the west-central
    Cascades Mountains of Oregon, USA. Spatial patterns in VWC were persistent over
    time, and contrary to expectations VWC at 30–60 cm depth was greater on divergent
    than convergent slopes, especially during wet periods (R2 = 0.27, p < 0.001).
    Vegetation characteristics were assessed for all VWC monitoring locations and
    soil properties were determined for 13 locations as local factors that affect
    spatial patterns in VWC. Mean VWC over all dates was negatively correlated to
    gravimetric rock content (R2 = 0.28, p = 0.03) and positively correlated to water
    storage at field capacity (R2 = 0.56, p < 0.01). The variability in rock content
    in quick-draining soils influenced soil-water retention, and by extension, created
    spatially heterogenous but temporally persistent patterns in VWC. While spatial
    patterns were persistent, they were not easily explained by surficial topography
    in a steep, mountainous landscape with rocky, well-drained soils. Further research
    is needed to understand if combined soil-terrain metrics would be a more useful
    proxy for VWC than terrain-based wetness metrics alone.
