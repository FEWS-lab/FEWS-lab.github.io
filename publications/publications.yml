- key: emelkoSedimentphosphorusDynamicsCan2016
  title: Sediment-phosphorus dynamics can shift aquatic ecology and cause downstream
    legacy effects after wildfire in large river systems
  authors:
  - firstName: Monica B.
    lastName: Emelko
    creatorType: author
  - firstName: Micheal
    lastName: Stone
    creatorType: author
