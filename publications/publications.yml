  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2016'
  journal: Global Change Biology
  volume: '22'
  issue: '3'
  pages: 1168-1184
  doi: 10.1111/gcb.13073
  abstract: Global increases in the occurrence of large, severe wildfires in forested
    watersheds threaten drinking water supplies and aquatic ecology. Wildfire effects
    on water quality, particularly nutrient levels and forms, can be significant.
    The longevity and downstream propagation of these effects as well as the geochemical
    mechanisms regulating them remain largely undocumented at larger river basin scales.
    Here, phosphorus (P) speciation and sorption behavior of suspended sediment were
    examined in two river basins impacted by a severe wildfire in southern Alberta,
    Canada. Fine-grained suspended sediments (<125 μm) were sampled continuously during
    ice-free conditions over a two-year period (2009–2010), 6 and 7 years after the
    wildfire. Suspended sediment samples were collected from upstream reference (unburned)
    river reaches, multiple tributaries within the burned areas, and from reaches
    downstream of the burned areas, in the Crowsnest and Castle River basins. Total
    particulate phosphorus (TPP) and particulate phosphorus forms (nonapatite inorganic
    P, apatite P, organic P), and the equilibrium phosphorus concentration (EPC0)
    of suspended sediment were assessed. Concentrations of TPP and the EPC0 were significantly
    higher downstream of wildfire-impacted areas compared to reference (unburned)
    upstream river reaches. Sediments from the burned tributary inputs contained higher
    levels of bioavailable particulate P (NAIP) – these effects were also observed
    downstream at larger river basin scales. The release of bioavailable P from postfire,
    P-enriched fine sediment is a key mechanism causing these effects in gravel-bed
    rivers at larger basin scales. Wildfire-associated increases in NAIP and the EPC0
    persisted 6 and 7 years after wildfire. Accordingly, this work demonstrated that
    fine sediment in gravel-bed rivers is a significant, long-term source of in-stream
    bioavailable P that contributes to a legacy of wildfire impacts on downstream
    water quality, aquatic ecology, and drinking water treatability.
