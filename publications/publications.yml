- key: hattenEffectsContemporaryForest2018
  title: 'Effects of contemporary forest harvesting on suspended sediment in the Oregon
    Coast Range: Alsea Watershed Study Revisited'
  authors:
  - firstName: Jeff A.
    lastName: Hatten
    creatorType: author
  - firstName: Catalina
    lastName: Segura
    creatorType: author
