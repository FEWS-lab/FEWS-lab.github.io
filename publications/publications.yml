- key: kangHydrologicResponsesWildfires2024
  title: Hydrologic responses to wildfires in western Oregon, USA
  authors:
  - firstName: Hyunwoo
    lastName: Kang
    creatorType: author
  - firstName: Ryan P.
    lastName: Cole
    creatorType: author
  - firstName: Lorrayne
