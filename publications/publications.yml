- key: bladonElevatedMortalityResidual2008
  title: Elevated mortality of residual trees following structural retention harvesting
    in boreal mixedwoods
  authors:
  - firstName: Kevin D
    lastName: Bladon
    creatorType: author
  - firstName: Victor J
    lastName: Lieffers
