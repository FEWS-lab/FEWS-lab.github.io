- key: farooqMechanisticEvaluationChitosan2026
  title: Mechanistic evaluation of chitosan and aluminum chlorohydrate pre-coagulation
    for fouling mitigation during ultrafiltration of wildfire-affected soil leachate
  authors:
  - firstName: Sohail
    lastName: Farooq
    creatorType: author
  - firstName: Ryan P.
    lastName: Cole
    creatorType: author
