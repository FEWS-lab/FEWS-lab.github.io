  journal: 'Journal of Geophysical Research: Biogeosciences'
  volume: '131'
  issue: '5'
  pages: e2025JG009611
  doi: 10.1029/2025JG009611
  abstract: Wildfires can substantially impact the hydrology of forested watersheds,
    increasing the risk of hydrologic hazards such as flash floods and debris flows.
    Soil hydraulic properties related to infiltration are a key control in determining
    the timing and magnitude of these hydrogeomorphic events. In our study, we collected
    445 soil cores from burned (216 cores) and unburned (229 cores) reference catchments
    and analyzed them for soil hydraulic properties 10 months after the 2022 Cedar
    Creek Fire in Oregon, USA. We observed significantly greater field-saturated hydraulic
    conductivity (Kfs), sorptivity (S), and wetting front potential (Ψf) in burned
    soils relative to unburned soils, with median ratios of 5.7, 4.4, and 5.0, respectively.
    Among low-, moderate-, and high burn severity groups, soil hydraulic properties
    were not statistically different. Reductions in median soil bulk density with
    increasing burn severity suggested an expansion of pore sizes, which may have
    been partially responsible for increasing Kfs and S. Additionally, in some burned
    soil samples, the increase in soil hydraulic properties may have been partially
    related to a concurrent reduction in “natural background” water repellency that
    is characteristic of dry, unburned soils in the Western Cascades. We observed
    no evidence of spatial autocorrelation in Kfs using semivariogram analysis. Principal
    component analysis paired with a k-means cluster analysis suggested that soil
    physical properties explained variations in soil hydraulic properties better than
    landscape attributes. Although there is a lack of regional results for comparison,
    our results trend in the opposite direction from drier, lower net primary productivity
    regions that are typically studied for post-wildfire soil hydraulic properties.
