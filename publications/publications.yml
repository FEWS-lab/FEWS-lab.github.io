- key: dymondDynamicHillslopeSoil2021
  title: Dynamic Hillslope Soil Moisture in a Mediterranean Montane Watershed
  authors:
  - firstName: Salli F.
    lastName: Dymond
    creatorType: author
  - firstName: Joseph W.
    lastName: Wagenbrenner
    creatorType: author
