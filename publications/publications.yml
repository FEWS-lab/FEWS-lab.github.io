  pages: 2359-2371
  doi: 10.1139/X08-071
  abstract: The objective of this study was to examine initial effects of the 2003
    Lost Creek wildfire (southwestern Rocky Mountains of Alberta) on concentrations
    and production (yield and total export) of several nitrogen (N) forms, and to
    explore initial recovery of these effects within the first 3 years after the fire.
    During the first postfire year, nitrate (NO3–), dissolved organic nitrogen (DON),
    and total nitrogen (TN) concentrations in severely burned watershed streams were
    6.5, 4.1, and 5.3 times greater, respectively, than those in reference streams.
    Weaker effects were evident for concentrations of ammonium (NH4+; 1.5 times) and
    total particulate nitrogen (TPN; 3.0 times). A rapid decline in mean watershed
    concentrations and production of NO3–, DON, total dissolved nitrogen (TDN), and
    TN was observed from burned watersheds over the three seasons after the fire.
    However, elevated NO3–, TDN, and TN concentrations and production were still evident
    during the snowmelt freshet and following precipitation events after 3 years.
    Effects of the burn were strongly influenced by the regional flow regime, with
    the most elevated N concentrations and production occurring during higher discharge
    periods (snowmelt freshet and storm flows).
