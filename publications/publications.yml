- key: emelkoImplicationsLandDisturbance2011
  title: 'Implications of land disturbance on drinking water treatability in a changing
    climate: Demonstrating the need for “source water supply and protection” strategies'
  authors:
  - firstName: Monica B.
    lastName: Emelko
    creatorType: author
  - firstName: Uldis
    lastName: Silins
    creatorType: author
