- key: niemeyerLongtermHydrologicRecovery2020
  title: Long-term hydrologic recovery after wildfire and post-fire forest management
    in the interior Pacific Northwest
  authors:
  - firstName: Ryan J.
    lastName: Niemeyer
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Richard D.
    lastName: Woodsmith
    creatorType: author
  date: '2020'
  journal: Hydrological Processes
  volume: '34'
  issue: '5'
  pages: 1182-1197
  doi: 10.1002/hyp.13665
  abstract: Elevated wildfire activity in many regions in recent decades has increased
    concerns about the short- and long-term effects on water quantity, quality, and
    aquatic ecosystem health. Often, loss of canopy interception and transpiration,
    along with changes in soil structural properties, leads to elevated total annual
    water yields, peak flows, and low flows. Post-fire land management treatments
    are often used to promote forest regeneration and mitigate effects to terrestrial
    and aquatic ecosystems. However, few studies have investigated the longer-term
    effects of either wildfire or post-fire land management on catchment hydrology.
    Our objectives were to quantify and compare the short- and longer-term effects
    of both wildfire and post-fire forest management treatments on annual discharge,
    peak flows, low flows, and evapotranspiration (AET). We analyzed ten years of
    pre-fire data, along with post-fire data from 1 to 7 and 35 to 41 years after
    wildfire burned three experimental catchments in the Entiat Experimental Forest
    (EEF) in the Pacific Northwest, USA. After the fire, two of the catchments were
    salvage logged, aerially seeded, and fertilized, while the third catchment remained
    as a burned reference. We observed increases in annual discharge (150–202%), peak
    flows (234–283%), and low flows (42–81%), along with decreases in AET (34–45%),
    across all three study catchments in the first seven year period after the EEF
    wildfire. Comparatively, annual discharge, peak flows, lows flows, and AET had
    returned to pre-fire levels 35–41 years after the EEF fire in the two salvage
    logged and seeded catchments. Surprisingly, in the catchment that was burned but
    not actively managed, the annual discharge and runoff ratios remained elevated,
    while AET remained lower, during the period 35–41 years after the EEF fire. We
    posit that differences in long-term hydrologic recovery across catchments were
    driven by delayed vegetation recovery in the unmanaged catchment. Our study demonstrates
    that post-fire land management decisions have the potential to produce meaningful
    differences in the long-term recovery of catchment-scale ecohydrologic processes
    and streamflow.
  url: https://onlinelibrary.wiley.com/doi/abs/10.1002/hyp.13665
