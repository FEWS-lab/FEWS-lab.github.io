- key: hallemaReframingChallengeGlobal2018
  title: Reframing the Challenge of Global Wildfire Threats to Water Supplies
  authors:
  - firstName: Dennis W.
    lastName: Hallema
    creatorType: author
  - firstName: François-Nicolas
    lastName: Robinne
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2018'
  journal: Earth's Future
  volume: '6'
  issue: '6'
  pages: 772-776
  doi: 10.1029/2018EF000867
  abstract: The timing, extent, and severity of forest wildfires have increased in
    many parts of the world in recent decades. These wildfires can have substantial
    and devastating impacts on water supply, ecohydrological systems, and sociohydrosystems.
    Existing frameworks to assess the magnitude and spatial extent of these effects
    generally focus on local processes or services and are not readily transferable
    to other regions. However, there is a growing need for regional, continental,
    and global scale indices to assess the potential effect of wildfires on freshwater
    availability and water supply resilience. Such indices must consider both the
    individual and compound effects of wildfires. In so doing, this will enable comprehensive
    insights on the water security paradigm and the value of hydrological services
    in fire-affected areas around the globe.
