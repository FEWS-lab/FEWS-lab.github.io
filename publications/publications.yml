- key: seguraLongtermEffectsForest2020
  title: Long-term effects of forest harvesting on summer low flow deficits in the
    Coast Range of Oregon
  authors:
  - firstName: Catalina
    lastName: Segura
    creatorType: author
  - firstName: Kevin D.
