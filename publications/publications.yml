- key: robinneSpatialEvaluationGlobal2018
  title: A spatial evaluation of global wildfire-water risks to human and natural
    systems
  authors:
  - firstName: François-Nicolas
    lastName: Robinne
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Carol
