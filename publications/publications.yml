  date: '2007-07-01'
  journal: Tree Physiology
  volume: '27'
  issue: '7'
  pages: 1065-1071
  doi: 10.1093/treephys/27.7.1065
  abstract: Variable retention harvesting (VRH) has been proposed as a silvicultural
    practice to maintain biodiversity and ecosystem integrity. No previous study has
    examined tree carbon isotope discrimination to provide insights into water stress
    that could lead to dieback and mortality of trees following VRH. We measured and
    compared the carbon isotope ratios (delta(13)C) in stem wood of trembling aspen
    (Populus tremuloides Michx.) before and after VRH. Eight trees were sampled from
    isolated residual, edge and control (interior of unharvested stand) positions
    from each of seven plots in three regions (Calling Lake and Drayton Valley, Alberta
    and Lac Duparquet, Québec). After VRH, the general trend in mean delta(13)C was
    residual > edge > control trees. Although this trend is indicative of water stress
    in residual trees, it also suggests that edge trees received some sheltering effect,
    reducing their stress compared with that of residuals. A strong inverse relationship
    was found between the delta(13)C values and the mean annual precipitation in each
    region. The trend in mean delta(13)C signature was Calling Lake > Drayton Valley
    > Lac Duparquet trees. These results suggest that residual or edge trees in drier
    regions are more likely to suffer water stress following VRH. We also observed
    a trend of greater delta(13)C in stout trees compared with slender trees, both
    before and after VRH. The evidence of greater water stress in stout trees likely
    occurred because of a positive relationship between stem diameter and crown volume
    per basal area. Our results provide evidence that water stress could be the driving
    mechanism leading to dieback and mortality of residual trees shortly after VRH.
    Additionally, the results from edge trees indicate that leaving hardwood residuals
    in larger patches or more sheltered landscape positions could reduce the water
    stress to which these trees are subjected, thereby reducing dieback and mortality.
