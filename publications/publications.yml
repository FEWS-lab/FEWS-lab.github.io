  pages: '106896'
  doi: 10.1016/j.envsoft.2026.106896
  abstract: The 2020 Labor Day fires in the Western Cascades of Oregon, USA, burned
    extensive forested areas, which altered hydrologic processes, water quality, aquatic
    ecosystems, and drinking water resources. Understanding wildfire severity effects
    on hydrologic processes is crucial for improved water resource management. Our
    study assessed wildfire severity impacts on hydrology using a modified calibration
    method for the Soil and Water Assessment Tool (SWAT) model. Calibration incorporated
    evapotranspiration and leaf area index to represent vegetation loss and hydrologic
    impacts. We also integrated a wildfire module to simulate fire effects on soil
    and vegetation parameters. This improved modeling approach effectively captured
    post-fire hydrologic behavior, especially increased high streamflows and reduced
    evapotranspiration, with greater changes linked to higher burn severity. These
    findings emphasize the importance of considering fire severity in hydrologic modeling,
    aiding proactive management and mitigation strategies to protect water supply
    and enhance ecosystem resilience in wildfire-prone regions.
