- key: beyeneBurnNotBurn2023
  title: 'To burn or not to burn: An empirical assessment of the impacts of wildfires
    and prescribed fires on trace element concentrations in Western US streams'
  authors:
  - firstName: Mussie T.
    lastName: Beyene
    creatorType: author
  - firstName: Scott G.
    lastName: Leibowitz
    creatorType: author
  - firstName: Christopher J.
    lastName: Dunn
