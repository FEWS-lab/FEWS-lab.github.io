- key: pimontEffectsWildfireSoil2026
  title: Effects of Wildfire on Soil Hydraulic Properties in the Western Oregon Cascades
  authors:
  - firstName: Cedric
    lastName: Pimont
    creatorType: author
  - firstName: Evan A.
    lastName: Thaler
    creatorType: author
  - firstName: Brian A.
    lastName: Ebel
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2026'
  journal: 'Journal of Geophysical Research: Biogeosciences'
  volume: '131'
  issue: '5'
  pages: e2025JG009611
  doi: 10.1029/2025JG009611
  abstract: Wildfires can substantially impact the hydrology of forested watersheds,
    increasing the risk of hydrologic hazards such as flash floods and debris flows.
    Soil hydraulic properties related to infiltration are a key control in determining
    the timing and magnitude of these hydrogeomorphic events. In our study, we collected
    445 soil cores from burned (216 cores) and unburned (229 cores) reference catchments
    and analyzed them for soil hydraulic properties 10 months after the 2022 Cedar
    Creek Fire in Oregon, USA. We observed significantly greater field-saturated hydraulic
    conductivity (Kfs), sorptivity (S), and wetting front potential (Ψf) in burned
    soils relative to unburned soils, with median ratios of 5.7, 4.4, and 5.0, respectively.
    Among low-, moderate-, and high burn severity groups, soil hydraulic properties
    were not statistically different. Reductions in median soil bulk density with
    increasing burn severity suggested an expansion of pore sizes, which may have
    been partially responsible for increasing Kfs and S. Additionally, in some burned
    soil samples, the increase in soil hydraulic properties may have been partially
    related to a concurrent reduction in “natural background” water repellency that
    is characteristic of dry, unburned soils in the Western Cascades. We observed
    no evidence of spatial autocorrelation in Kfs using semivariogram analysis. Principal
    component analysis paired with a k-means cluster analysis suggested that soil
    physical properties explained variations in soil hydraulic properties better than
    landscape attributes. Although there is a lack of regional results for comparison,
    our results trend in the opposite direction from drier, lower net primary productivity
    regions that are typically studied for post-wildfire soil hydraulic properties.
  url: https://onlinelibrary.wiley.com/doi/abs/10.1029/2025JG009611
  primary: yes
- key: kangModelingHydrologicResponse2026
  title: Modeling hydrologic response to wildfires in the Pacific Northwest with a
    modified calibration technique
  authors:
  - firstName: Hyunwoo
    lastName: Kang
    creatorType: author
  - firstName: Cameron E.
    lastName: Naficy
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2026-03-01'
  journal: Environmental Modelling & Software
  volume: '198'
  issue: ~
  pages: '106896'
  doi: 10.1016/j.envsoft.2026.106896
  abstract: The 2020 Labor Day fires in the Western Cascades of Oregon, USA, burned
    extensive forested areas, which altered hydrologic processes, water quality, aquatic
    ecosystems, and drinking water resources. Understanding wildfire severity effects
    on hydrologic processes is crucial for improved water resource management. Our
    study assessed wildfire severity impacts on hydrology using a modified calibration
    method for the Soil and Water Assessment Tool (SWAT) model. Calibration incorporated
    evapotranspiration and leaf area index to represent vegetation loss and hydrologic
    impacts. We also integrated a wildfire module to simulate fire effects on soil
    and vegetation parameters. This improved modeling approach effectively captured
    post-fire hydrologic behavior, especially increased high streamflows and reduced
    evapotranspiration, with greater changes linked to higher burn severity. These
    findings emphasize the importance of considering fire severity in hydrologic modeling,
    aiding proactive management and mitigation strategies to protect water supply
    and enhance ecosystem resilience in wildfire-prone regions.
  url: https://www.sciencedirect.com/science/article/pii/S1364815226000435
