  doi: 10.1016/j.jhydrol.2014.05.006
  abstract: In 2003, the Lost Creek wildfire severely burned 21,000 hectares of forest
    on the eastern slopes of the Canadian Rocky Mountains. Seven headwater catchments
    with varying levels of disturbance (burned, post-fire salvage logged, and unburned)
    were instrumented as part of the Southern Rockies Watershed Project to measure
    streamflow, stream temperature, and meteorological conditions. From 2004 to 2010
    mean annual stream temperature (Ts) was elevated 0.8–2.1°C in the burned and post-fire
    salvage logged streams compared to the unburned streams. Mean daily maximum Ts
    was 1.0–3.0°C warmer and mean daily minimum Ts was 0.9–2.8°C warmer in the burned
    and post-fire salvage logged streams compared to the unburned catchments. The
    effects of wildfire on the thermal regime of the burned catchments were persistent
    and trend analysis showed no apparent recovery during the study period. Temporal
    patterns of Ts were strongly associated with seasonal variability of surface and
    groundwater interactions and air temperature. Advective heat fluxes between groundwater
    and surface water were likely the dominant controls on Ts, though the strength
    of these advective controls varied among catchments highlighting the importance
    of simultaneous catchment-scale and process-focused research to better elucidate
    the physical drivers influencing Ts response to disturbance.
