  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2023-03-10'
  journal: Science of The Total Environment
  volume: '863'
  issue: ~
  pages: '160731'
  doi: 10.1016/j.scitotenv.2022.160731
  abstract: The use of low-severity prescribed fires has been increasingly promoted
    to reduce the impacts from high-severity wildfires and maintain ecosystem resilience.
    However, the effects of prescribed fires on water quality have rarely been evaluated
    relative to the effects of wildfires. In this study, we assessed the effects of
    54 wildfires and 11 prescribed fires on trace element (arsenic, selenium, and
    cadmium) concentrations of streams draining burned watersheds in the western US.
    To obtain results independent of the choice of method, we employed three independent
    analytical approaches to evaluate fire effects on water quality for the first
    three post-fire years. In general, we observed significant increases in trace
    element concentrations in streams burned by large, high-severity wildfires, despite
    substantial variability across sites. Comparatively, we did not observe increases
    in the spring mean concentration of arsenic, selenium, and cadmium in watersheds
    burned by prescribed fires. Our analysis indicated that the post-fire trace element
    response in streams was primarily influenced by burn area, burn severity, post-fire
    weather, surface lithology, watershed physiography, and land cover. This study's
    results demonstrate that prescribed burns could lessen the post-fire trace element
    loads in downstream waters if prescribed fires reduce subsequent high severity
    fires in the landscape.
