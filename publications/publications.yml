  doi: 10.1021/acs.est.3c10826
  abstract: |-
    Wildfires
    produce solid residuals that have unique chemical and
    physical properties compared to unburned materials, which influence their cycling and fate in the natural environment. Visual burn severity assessment is used to evaluate post-fire alterations to the landscape in field-based studies, yet muffle furnace methods are commonly used in laboratory studies to assess molecular scale alterations along a temperature continuum. Here, we examined solid and leachable organic matter characteristics from chars visually characterized as low burn severity that were created either on an open air burn table or from low-temperature muffle furnace burns. We assessed how the different combustion conditions influence solid and dissolved organic matter chemistries and explored the potential influence of these results on the environmental fate and reactivity. Notably, muffle furnace chars produced less leachable carbon and nitrogen than open air chars across land cover types. Organic matter produced from muffle furnace burns was more homogeneous than open air chars. This work highlights chemical heterogeneities that exist within a single burn severity category, potentially influencing our conceptual understanding of pyrogenic organic matter cycling in the natural environment, including transport and processing in watersheds. Therefore, we suggest that open air burn studies are needed to further advance our understanding of pyrogenic organic matter’s environmental reactivity and
    fate.
