    creatorType: author
  date: '2024-08-01'
  journal: Journal of Hydrology
  volume: '639'
  issue: ~
  pages: '131612'
  doi: 10.1016/j.jhydrol.2024.131612
  abstract: 'Wildfires can dramatically alter vegetation cover and soil properties
    across large scales, resulting in substantial shifts in runoff generation, streamflow,
    and water quality. In September 2020, extensive and high-severity wildfires burned
    more than 490,000 ha of forest land on the westside of the Cascade Mountain Range
    in the Pacific Northwest. Much of the area impacted by these fires is critical
    for the provision of water for downstream aquatic ecosystems, agriculture, hydropower,
    recreation, and municipal drinking water. We undertook a study to evaluate the
    effects of four of the large high severity wildfires from 2020 (Riverside, Beachie
    Creek, Lionshead, and Holiday Farm) on streamflow in nine burned catchments in
    western Oregon. We also included four unburned, reference catchments in our analysis
    to enable us to assess post-fire streamflow changes in the burned catchments.
    To quantify the effects of wildfire on the catchment water balance we used publicly
    available streamflow data and estimated precipitation, potential evapotranspiration
    (PET), and actual evapotranspiration (ET), using satellite-based meteorological
    data. We quantified catchment area burned and burn severity with the average differenced
    normalized burn ratio (dNBR). We compared hydrologic conditions for the pre-fire
    (2001–2020) and post-fire (2021–2022) periods by analyzing catchment runoff ratios,
    ET ratios (evaporative index: quotient of ET divided by precipitation, referred
    to as EI hereafter), and Budyko curves. We also used random forest models to explore
    factors influencing the variability in EI. During the post-fire period, we observed
    decreases in EI and increases in runoff ratio in the burned catchments. Post-fire
    declines in EI were positively related to burn severity (R2 = 0.70 in 2021; 0.76
    in 2022) and area burned (R2 = 0.91 in 2021; 0.95 in 2022), and were primarily
    driven by decreases in ET. Declines in ET were highly variable, ranging from 10.7–40.2 %
    in the first year after the fires and 6.1–32.0 % in the second year after the
    fires, and were generally related to catchment burn severity and area burned.
    The greatest increases in runoff (16.1 % in 2021 and 19.8 % in 2022) occurred
    in the same catchment. These results were reinforced by the random forest analysis,
    which illustrated the importance of burn severity as a predictor of EI. Interestingly,
    the variability in changes in EI during the post-fire period was also associated
    with other geomorphic factors such as catchment slope, elevation, geology, aspect,
    and pre-fire vegetation type. Since the duration and seasonality of post-fire
    impacts on hydrology remain uncertain, our findings bring new insights and guide
    future studies into the post-fire responses on hydrology that are crucial for
    water and forest management.'
  url: https://www.sciencedirect.com/science/article/pii/S0022169424010084
