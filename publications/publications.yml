  informal: no
- key: robinneCanadaSourceWatershed2023
  title: 'Canada Source Watershed Polygons (Can-SWaP): A dataset for the protection
    of Canada’s municipal water supply'
  authors:
  - firstName: François-Nicolas
    lastName: Robinne
    creatorType: author
  - firstName: Chloé
    lastName: Lamache
    creatorType: author
  - firstName: Daniel K.
    lastName: Thompson
    creatorType: author
  - firstName: Jason A.
