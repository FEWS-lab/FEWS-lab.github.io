- key: bladonMulticatchmentAnalysisHeadwater2018
  title: A multicatchment analysis of headwater and downstream temperature effects
    from contemporary forest harvesting
  authors:
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Catalina
    lastName: Segura
    creatorType: author
  - firstName: Nicholas A.
    lastName: Cook
    creatorType: author
  - firstName: Sharon
    lastName: Bywater-Reyes
    creatorType: author
  - firstName: Maryanne
    lastName: Reiter
    creatorType: author
  date: '2018'
  journal: Hydrological Processes
  volume: '32'
  issue: '2'
  pages: 293-304
  doi: 10.1002/hyp.11415
  abstract: Stream temperature is a key physical water-quality parameter, controlling
    many biological, chemical, and physical processes in aquatic ecosystems. Maintenance
    of cool stream temperatures during summer is critical for high-quality aquatic
    habitat. As such, transmission of warm water from small, nonfish-bearing headwater
    streams after forest harvesting could cause warming in downstream fish-bearing
    stream reaches with negative consequences. In this study, we evaluate (a) the
    effects of contemporary forest management practices on stream temperature in small,
    headwater streams, (b) the transmission of thermal signals from headwater reaches
    after harvesting to downstream fish-bearing reaches, and (c) the relative role
    of lithology and forest management practices in influencing differential thermal
    responses in both the headwater and downstream reaches. We measured summer stream
    temperatures both preharvest and postharvest at 29 sites—12 upstream sites (4
    reference, 8 harvested) and 17 downstream sites (5 reference, 12 harvested)—across
    3 paired watershed studies in western Oregon. The 7-day moving average of daily
    maximum stream temperature (T7DAYMAX) was greater during the postharvest period
    relative to the preharvest period at 7 of the 8 harvested upstream sites. Although
    the T7DAYMAX was generally warmer in the downstream direction at most of the stream
    reaches during both the preharvest and postharvest period, there was no evidence
    for additional downstream warming related to the harvesting activity. Rather,
    the T7DAYMAX cooled rapidly as stream water flowed into forested reaches 370–1,420
    m downstream of harvested areas. Finally, the magnitude of effects of contemporary
    forest management practices on stream temperature increased with the proportion
    of catchment underlain by more resistant lithology at both the headwater and downstream
    sites, reducing the potential for the cooling influence of groundwater.
