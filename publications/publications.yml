- key: wamplerModelingWildfireEffects2023
  title: Modeling wildfire effects on streamflow in the Cascade Mountains, Oregon,
    USA
  authors:
  - firstName: K. A.
    lastName: Wampler
    creatorType: author
  - firstName: K. D.
    lastName: Bladon
    creatorType: author
  - firstName: M.
    lastName: Faramarzi
    creatorType: author
  date: '2023-06-01'
  journal: Journal of Hydrology
  volume: '621'
  issue: ~
  pages: '129585'
  doi: 10.1016/j.jhydrol.2023.129585
  abstract: Increasing occurrence of large and severe wildfires represents a growing
    threat to forested watersheds and the many ecosystem services they provide. Past
    research has shown that wildfires can cause substantial increases in peak flows
    and annual water yields, leading to potential water quality concerns and land
    and water management challenges. However, responses have been variable, and there
    have been few studies at large basin scales, leading to uncertainties about post-fire
    hydrologic responses. To address these uncertainties, we projected the effect
    of three large wildfires (>70,000 ha) on streamflow in two important forested
    watersheds in the Cascade Range of Oregon, US. We modeled the streamflow response
    using the Soil and Water Assessment Tool (SWAT) model, calibrated on data from
    prior to the wildfires. We modified model parameters to represent the impacts
    of the wildfires based on burn severity maps. Burned and unburned scenarios were
    compared using random forest models to identify drivers of increased annual water
    yields and peak flows. Post-fire annual water yield changes were controlled by
    burn severity, annual precipitation, area burned, aridity, and vegetation type,
    while post-fire peak flow changes were controlled by burn severity, area burned,
    aridity, soil type, and geologic province. We also found that post-fire increases
    in annual water yields, peak flows, and low flows were greatest at the headwater
    scale but were more muted at the downstream basin scale. Our work provides valuable
    insights into the range of potential post-fire streamflow changes at the headwater
    and larger basin scale, which is becoming increasingly critical for effective
    forest and water management decisions.
  url: https://www.sciencedirect.com/science/article/pii/S0022169423005279
  has_article: yes
  primary: yes
  inreview: no
  informal: no
- key: ebelHydrologicRecoveryWildfire2022
  title: 'Hydrologic recovery after wildfire: A framework of approaches, metrics,
    criteria, trajectories, and timescales'
  authors:
  - firstName: Brian A.
    lastName: Ebel
    creatorType: author
  - firstName: Joseph W.
    lastName: Wagenbrenner
    creatorType: author
  - firstName: Alicia M.
    lastName: Kinoshita
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: 2022/11/16
  journal: Journal of Hydrology and Hydromechanics
  volume: '70'
  issue: '4'
  pages: 388-400
  doi: 10.2478/johh-2022-0033
  abstract: '<p>Deviations in hydrologic processes due to wildfire can alter streamflows
    across the hydrograph, spanning peak flows to low flows. Fire-enhanced changes
    in hydrologic processes, including infiltration, interception, and evapotranspiration,
    and the resulting streamflow responses can affect water supplies, through effects
    on the quantity, quality, and timing of water availability. Post-fire shifts in
    hydrologic processes can also alter the timing and magnitude of floods and debris
    flows. The duration of hydrologic deviations from a pre-fire condition or function,
    sometimes termed hydrologic recovery, is a critical concern for land, water, and
    emergency managers. We reviewed and summarized terminology and approaches for
    defining and assessing hydrologic recovery after wildfire, focusing on statistical
    and functional definitions. We critically examined advantages and drawbacks of
    current recovery assessment methods, outline challenges to determining recovery,
    and call attention to selected opportunities for advancement of post-fire hydrologic
    recovery assessment. Selected challenges included hydroclimatic variability, post-fire
    land management, and spatial and temporal variability. The most promising opportunities
    for advancing assessment of hydrologic recovery include: (1) combining statistical
    and functional recovery approaches, (2) using a greater diversity of post-fire
    observations complemented with hydrologic modeling, and (3) defining optimal assemblages
    of recovery metrics and criteria for common hydrologic concerns and regions.</p>'
  url: https://reference-global.com/article/10.2478/johh-2022-0033
