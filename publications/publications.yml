- key: hallemaRegionalPatternsPostwildfire2017
  title: 'Regional patterns of postwildfire streamflow response in the Western United
    States: The importance of scale-specific connectivity'
  authors:
  - firstName: Dennis W.
    lastName: Hallema
    creatorType: author
  - firstName: Ge
    lastName: Sun
    creatorType: author
  - firstName: Kevin D.
