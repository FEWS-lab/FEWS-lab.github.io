    creatorType: author
  date: '2026-09-28'
  journal: Separation and Purification Technology
  volume: '406'
  issue: ~
  pages: '138996'
  doi: 10.1016/j.seppur.2026.138996
  abstract: Wildfires can impair source water quality by increasing turbidity, dissolved
    organic matter (DOM), nutrients, and disinfection by-product precursor loading,
    creating challenges for membrane-based drinking water treatment. In this study,
    aluminum chlorohydrate (ACH) and chitosan were compared as pre-coagulants for
    inline coagulation–ultrafiltration (UF) treatment of wildfire-affected soil leachate.
    The effects of coagulant type, dose, and pH on coagulation performance, membrane
    fouling, permeate quality, and fouling mechanisms were evaluated. Without pre-coagulation,
    severe reversible and irreversible fouling occurred due to elevated turbidity,
    dissolved organic carbon (DOC), and aromatic organic matter. At neutral pH, chitosan
    outperformed ACH at a substantially lower optimal dose (3 mg/L versus 10 mg/L),
    achieving greater turbidity, DOC, and UV₂₅₄ removal through combined charge neutralization
    and polymer bridging. Chitosan formed larger, more porous flocs, resulting in
    slower flux decline and reduced pore blocking and cake-layer formation. Although
    DOC and UV₂₅₄ removal by chitosan was highest near pH 6, fouling mitigation was
    most effective at pH 7. At lower pH, excess protonated chitosan adsorbed onto
    the negatively charged membrane surface, increasing fouling resistance, as supported
    by SEM–EDS, contact angle, zeta potential, and ATR-FTIR analyses. Chitosan pre-coagulation
    also improved UF permeate quality by enhancing removal of aromatic DOM, including
    humic- and fulvic-like fractions. Overall, this study demonstrates that chitosan
    is a promising alternative to aluminum-based coagulants for improving UF treatment
    of wildfire-affected soil leachate, although further validation with real post-fire
    source waters is needed.
