  journal: IAHS-AISH publication
  volume: ~
  issue: ~
  pages: ~
  doi: ~
  abstract: The 2003 Lost Creek fire burned 21 000 ha of forested land in the Oldman
    River basin, Alberta, Canada. Seven watersheds, with varying degrees of natural
    and man-made land disturbance (burned, post- fire salvage logged, unburned) were
    monitored for three years to assess sediment concentrations and production (export
    and yield) over a range of flow regimes (spring melt, baseflow and stormflow).
    Suspended sediment concentrations were 6-times higher in burned watersheds and
    11-times higher in post- fire salvage logged watersheds than in unburned watersheds.
    Sediment availability was greater in both burned and post-fire salvage logged
    watersheds but varied with flow condition; particularly during the snowmelt freshet
    and stormflow. In burned watersheds, sediment yield was 5-times higher during
    snowmelt and 13-times higher during stormflow than in unburned watersheds. Post-fire
    salvage logging produced much greater impacts than wildfire alone, with mean sediment
    yield 19-times higher during snowmelt and 9-times higher during stormflow compared
    to unburned watersheds.
