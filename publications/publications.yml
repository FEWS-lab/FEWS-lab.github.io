    lastName: Stednick
    creatorType: author
  date: '2018-01-15'
  journal: Forest Ecology and Management
  volume: '408'
  issue: ~
  pages: 238-248
  doi: 10.1016/j.foreco.2017.10.049
  abstract: Forest harvesting practices can expose mineral soils, decrease infiltration
    capacities of soils, disturb the stream bank and channel, and increase erosion
    and fine sediment supply to stream channels. To reduce nonpoint source sediment
    pollution associated with forest management activities and to maintain the high
    water quality typically provided from forests, best management practices (BMPs)
    were developed and implemented. While BMPs have evolved over time, the effectiveness
    of contemporary BMPs, particularly for harvesting practices, have not been thoroughly
    investigated, especially in comparison to historical practices. The objectives
    of this study were to (1) determine the effects of contemporary harvesting practices
    on suspended sediment concentrations and yields and (2) examine the legacy effects
    from historical harvesting on suspended sediment concentrations. The Alsea Watershed
    Study was an important early research site that lead to the development of contemporary
    forest management practices to protect water quality and fish habitat in Oregon
    and elsewhere. By returning to the same watersheds that were harvested in 1966,
    this is one of the few times that a watershed-scale study is able to directly
    compare and contrast the effects of historical practices with contemporary practices.
    The Alsea Watershed Study Revisited includes the same three watersheds as the
    original study. Flynn Creek (FCG, 219 ha) is an old-growth dominated reference
    watershed. Deer Creek (DCG, 315 ha) is an extensively managed watershed that was
    patch-cut during the original study. Needle Branch (NBLG, 94 ha) was clearcut
    harvested in the original study and again in the recent study, but with contemporary
    BMPs, including riparian buffers. The upper portion of Needle Branch was harvested
    in 2009 (Phase I), while the lower portion of the watershed was harvested in 2015
    (Phase II). We monitored suspended sediments and discharge from WY 2006–2016,
    and analyzed this data using multiple linear regression procedures and ANCOVA.
    Average suspended sediment yields ranged from 55–313 Mg km−2 yr−1 in FCG, 31–102 Mg km−2 yr−1
    in NBLG, and 69–127 Mg km−2 yr−1 in DCG. We found no evidence that contemporary
    harvesting techniques affected suspended sediment concentrations or yields. Overall,
    suspended sediment concentrations and yields after contemporary harvesting were
    similar to historical pre-treatment levels.
