  informal: no
- key: rachelsQuantifyingEffectsForest2020
  title: Quantifying effects of forest harvesting on sources of suspended sediment
    to an Oregon Coast Range headwater stream
  authors:
  - firstName: Aaron A.
    lastName: Rachels
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Sharon
    lastName: Bywater-Reyes
    creatorType: author
  - firstName: Jeff A.
    lastName: Hatten
    creatorType: author
  date: '2020-06-15'
  journal: Forest Ecology and Management
  volume: '466'
  issue: ~
  pages: '118123'
  doi: 10.1016/j.foreco.2020.118123
  abstract: 'Elevated fine sediment transport to streams can negatively affect aquatic
    ecosystem health, downstream infrastructure, and community water supply. Forest
    harvesting activities can increase the delivery of fine sediment to streams due
    to intensified erosion or mass wasting from hillslopes, roads, and stream channels.
    However, quantifying the effects of forest harvesting on sediment inputs to streams
    and the effectiveness of current best management practices (BMPs) at mitigating
    these effects remains a challenge. In this study, we used sediment source fingerprinting
    techniques to quantify and compare the sources of suspended sediment to a stream
    draining a recently harvested catchment and a nearby, unharvested reference catchment
    in the Oregon Coast Range of the U.S. Pacific Northwest. In each stream, we quantified
    the proportional contributions of suspended sediment from three potential source
    areas: hillslopes, roads, and streambanks. The primary source of suspended sediment
    in the harvested catchment was streambank sediment (90.2 ± 3.4%) with lesser amounts
    of hillslope (7.1 ± 3.1%) and road (3.6 ± 3.6%) sediment. Interestingly, the proportional
    contributions of suspended sediment in the reference catchment were similar, with
    the majority from streambanks (93.1 ± 1.8%) followed by hillslopes (6.9 ± 1.8%).
    There were no contributions from roads in the reference catchment, despite a similar
    road network as the harvested catchment. We also quantified monthly sediment mass
    eroded from 36 × 1 m2 hillslope plots. The sediment mass eroded from the general
    harvest area (96.5 ± 57.0 (SE) g) was ~10.6-times greater than the sediment collected
    in the riparian buffer (9.1 ± 1.9 g) and ~4.6-times greater than the sediment
    collected on the unharvested, reference hillslope (21.0 ± 3.3 g). While this study
    provides evidence of effectiveness of contemporary BMPs (e.g., riparian management
    areas, limits to cutblock size, reduced impact forest harvesting techniques, road
    building and maintenance) at mitigating sediment delivery to streams, additional
    research is needed as existing studies do not adequately reflect the broad range
    of climate, geology, topography, and vegetation in the Pacific Northwest, which
    drive highly variable hydrologic and geomorphic processes in the region.'
  url: https://www.sciencedirect.com/science/article/pii/S0378112720301572
