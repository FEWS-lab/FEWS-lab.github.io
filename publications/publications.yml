- key: puntenney-desmondRunoffSedimentProduction2020
  title: Runoff and sediment production from harvested hillslopes and the riparian
    area during high intensity rainfall events
  authors:
  - firstName: Kira C.
    lastName: Puntenney-Desmond
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  - firstName: Uldis
    lastName: Silins
    creatorType: author
  date: '2020-03-01'
  journal: Journal of Hydrology
  volume: '582'
  issue: ~
  pages: '124452'
  doi: 10.1016/j.jhydrol.2019.124452
  abstract: 'Forest harvesting often decreases soil infiltration capacity, leading
    to rapid and increased delivery of surface runoff, shallow subsurface runoff,
    and sediment to streams. While the general harvest area is typically the largest
    area of disturbance, relative to forest roads or skid trails, less is known about
    the degree to which the general harvest areas act as sources or sinks for runoff
    and sediment transport. This includes a need to improve understanding of the potential
    for runoff and sediment delivery from harvest areas through riparian buffers to
    streams during infrequent, high intensity precipitation events, which are predicted
    to increase due to climate change. In this study, we used rainfall simulations
    to investigate surface/shallow subsurface runoff, and sediment transport from
    plots during extreme precipitation events within a steep, headwater catchment
    in the Rocky Mountains. Simulations consisted of one hour of high intensity rainfall
    (I60: 70–80 mm h−1), representative of an ~100 year, or greater, storm event for
    the northern Rocky Mountain region. Our objectives were to compare runoff rates,
    sediment concentrations, and sediment yields between the general harvest area,
    along the edge of the riparian buffer at the interface with the harvested area,
    and within the riparian buffer. Surface/shallow subsurface runoff rates were greatest
    in the riparian buffer relative to the harvest area, especially when soil conditions
    were dry. Mechanical soil disturbance during forest harvesting appeared to result
    in higher infiltration rates and vertical, preferential flow relative to the riparian
    buffer. However, sediment concentrations in runoff from plots in the general harvest
    area were ~15.8-times greater than in the riparian buffer and ~4.2-times greater
    than at the harvest-riparian edge. Comparatively, sediment yields in the general
    harvest area were ~2.0-times greater than in the riparian buffer and ~1.2-times
    greater than at the harvest-riparian edge. Quantitative and qualitative evidence
    suggests differences in runoff and sediment between the harvest area, harvest-riparian
    edge, and riparian buffer were due to site differences in hydrophobicity, surface
    roughness, soil water content, and sediment supply. While we observed moderately
    high variability with only modest replication, the spatial patterns in the amount
    and timing of runoff, sediment production, and their relationships with soil moisture
    were consistent and monotonic along the gradient from harvested areas through
    riparian buffers. This highlights the need for additional research to explore
    if similar patterns appear evident after forest harvesting in other hydro-climatic
    settings.'
  url: https://www.sciencedirect.com/science/article/pii/S0022169419311874
  has_article: yes
  primary: no
  inreview: no
  informal: no
- key: pateStreamflowPermanenceHeadwater2020
  title: Streamflow permanence in headwater streams across four geomorphic provinces
    in Northern California
  authors:
  - firstName: Adam A.
    lastName: Pate
    creatorType: author
  - firstName: Catalina
    lastName: Segura
    creatorType: author
  - firstName: Kevin D.
    lastName: Bladon
    creatorType: author
  date: '2020'
  journal: Hydrological Processes
  volume: '34'
  issue: '23'
  pages: 4487-4504
  doi: 10.1002/hyp.13889
  abstract: Mountainous headwater streams represent a substantial proportion of the
    global stream network. These small streams may flow episodically, seasonally,
    or perennially, providing diverse values and services. Given their broad importance
    and growing pressures on terrestrial and aquatic resources, we must improve our
    understanding of the drivers of flow permanence to facilitate informed land and
    water management decisions. We used field observations from >10 cross-sections
    in each of 101 non-fish bearing, headwater streams across four geomorphic provinces
    in Northern California to quantify flow permanence and network connectivity during
    the summer low flow period in 2018. At each stream cross-section, we noted the
    presence or absence of streamflow and used this information to classify streams
    as perennial (continuous streamflow in all cross-sections) or non-perennial and
    connected (surface water in the most downstream cross-section) or disconnected.
    At each cross-section, we also quantified channel size (width and depth) and grain
    size. We coupled field observations with geospatial data of catchment physiography,
    hydrology, and climate in random forest models to investigate controls of flow
    permanence and network connectivity. Potential drivers of flow permanence or network
    connectivity included in our models were channel geometry, grain size, slope,
    aspect, elevation, annual and seasonal precipitation, air temperature, and topographic
    wetness index. We found more perennial streams in the Klamath Mountains and Sierra
    Nevada than in the Cascades and N. Coast regions. Streams in the Klamath were
    the most connected followed by streams in the N. Coast, Sierra Nevada, and Cascades.
    The most important variables for predicting flow permanence were channel grain
    size, winter 2018 precipitation, and drainage area. Comparatively, the most important
    variables for predicting network connectivity were winter and spring 2018 precipitation,
    grain size, and bankfull depth. Our study illustrated the complexity of the processes
    that drive flow permanence and highlighted the uncertainty in projecting the precense
    of water in streams across diverse regions.
